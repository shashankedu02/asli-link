name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (core + API)
        run: pytest -v
      - name: Server starts and answers
        run: |
          uvicorn server.app:app --port 8000 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8000/api/check -H 'Content-Type: application/json' \
            -d '{"text":"Update KYC: https://sbi-kyc-update.top/login"}' | grep -q impersonation_signals
          curl -sf http://127.0.0.1:8000/ | grep -q "Asli Link"
